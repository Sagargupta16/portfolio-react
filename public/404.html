<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="theme-color" content="#0b1012" />
      <meta name="robots" content="noindex" />
      <title>Page not found | Sagar Gupta</title>
      <link rel="icon" href="/portfolio-react/favicon.ico" />
      <style>
         :root {
            color-scheme: dark;
            font-family:
               Inter,
               system-ui,
               -apple-system,
               BlinkMacSystemFont,
               "Segoe UI",
               sans-serif;
            background: #0b1012;
            color: #f4f6f7;
         }

         * {
            box-sizing: border-box;
         }

         body {
            min-height: 100dvh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
               radial-gradient(
                  circle at 50% 15%,
                  rgb(37 99 235 / 0.12),
                  transparent 38%
               ),
               #0b1012;
         }

         main {
            width: min(100%, 520px);
            padding: clamp(32px, 8vw, 56px);
            text-align: center;
            border: 1px solid rgb(255 255 255 / 0.08);
            border-radius: 20px;
            background: #0e1417;
         }

         .code {
            margin: 0 0 16px;
            color: #60a5fa;
            font-family: "JetBrains Mono", ui-monospace, monospace;
            font-size: clamp(72px, 20vw, 128px);
            font-weight: 800;
            letter-spacing: -0.08em;
            line-height: 0.9;
         }

         h1 {
            margin: 0 0 12px;
            font-size: clamp(24px, 5vw, 32px);
            line-height: 1.2;
         }

         p {
            margin: 0 auto 28px;
            max-width: 380px;
            color: #9ca9b0;
            line-height: 1.7;
         }

         a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 10px 22px;
            border: 1px solid transparent;
            border-radius: 8px;
            color: #fff;
            background: #2563eb;
            font-weight: 700;
            text-decoration: none;
            transition: background 0.2s ease;
         }

         a:hover {
            background: #1d4ed8;
         }

         a:focus-visible {
            outline: 2px solid #60a5fa;
            outline-offset: 3px;
         }

         @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
               scroll-behavior: auto !important;
               animation-duration: 0.01ms !important;
               animation-iteration-count: 1 !important;
               transition-duration: 0.01ms !important;
            }
         }
      </style>
   </head>
   <body>
      <main>
         <p class="code" aria-hidden="true">404</p>
         <h1>Page not found</h1>
         <p>
            This page does not exist or has moved. Return to the portfolio to
            keep exploring.
         </p>
         <a href="/portfolio-react/">Back to portfolio</a>
      </main>

      <script>
         var base = "/portfolio-react/";
         var section = location.pathname.slice(base.length).split("/")[0];
         var sections = new Set([
            "about",
            "experience",
            "education",
            "skills",
            "projects",
            "achievements",
            "services",
            "stats",
            "contact",
         ]);
         if (sections.has(section)) location.replace(base + "#" + section);
      </script>
   </body>
</html>
