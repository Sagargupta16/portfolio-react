name: Portfolio CI/CD

on:
   push:
      branches: [main]
   pull_request:
      branches: [main]
   # On main this builds and deploys. On any other branch it runs the gates
   # only: the bot sync workflows dispatch it on their branch, because the
   # pull_request run for a PR their GITHUB_TOKEN opened never starts a job.
   workflow_dispatch:
   # For a ping from latex-resume when it publishes a release.
   repository_dispatch:
      types: [resume-released]
   # Picks up a latex-resume release nobody announced: resume-check compares
   # the live CV with the latest release and the build runs only on a gap.
   schedule:
      - cron: "23 */6 * * *"

env:
   # The live site root; the scheduled resume check reads the CV from here.
   SITE_URL: https://sagargupta.online/portfolio-react

# Concurrency is set per job, so a scheduled run whose CV is current (it
# skips ci) never takes the place of a queued push build.
jobs:
   resume-check:
      if: github.event_name == 'schedule'
      permissions:
         contents: read
      runs-on: ubuntu-latest
      timeout-minutes: 5
      outputs:
         stale: ${{ steps.compare.outputs.stale }}
      steps:
         - name: Compare the live CV with the latest resume release
           id: compare
           env:
              GH_TOKEN: ${{ github.token }}
           run: |
              latest="$(gh api repos/Sagargupta16/latex-resume/releases/latest --jq .tag_name)"
              # cv.json names the release tag it was parsed from; manifest.json
              # carries it too, for a build whose web view was skipped.
              # --proto =https: the request and any redirect it follows stay on HTTPS.
              live="$(curl -fsSL --proto '=https' "$SITE_URL/resume-pages/cv.json" | jq -r '.version // empty' || true)"
              if [ -z "$live" ]; then
                 live="$(curl -fsSL --proto '=https' "$SITE_URL/resume-pages/manifest.json" | jq -r '.version // empty' || true)"
              fi
              echo "Latest release: $latest. Live site: ${live:-unknown}."
              if [ "$latest" = "$live" ]; then stale=false; else stale=true; fi
              echo "stale=$stale" >> "$GITHUB_OUTPUT"

   ci:
      needs: resume-check
      # resume-check runs only on the schedule and is skipped otherwise; a
      # scheduled run builds only when the live CV is behind the release.
      if: >
         !cancelled() &&
         (github.event_name != 'schedule' || needs.resume-check.outputs.stale == 'true')
      concurrency:
         group: "ci-${{ github.ref }}"
         # A newer PR push supersedes the old run; runs on main queue instead.
         cancel-in-progress: ${{ github.event_name == 'pull_request' }}
      permissions:
         contents: read
      runs-on: ubuntu-latest
      timeout-minutes: 20
      env:
         # Only main deploys, so only main fetches the resume and uploads Pages.
         DEPLOY: ${{ github.ref == 'refs/heads/main' }}
      steps:
         - name: Checkout code
           uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

         - name: Setup pnpm
           uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
           with:
              version: 11.28.4

         - name: Setup Node.js
           uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
           with:
              node-version: 24
              cache: pnpm

         - name: Install dependencies
           run: pnpm install --frozen-lockfile

         - name: Check formatting
           run: pnpm format:check

         - name: Lint code and scripts
           run: pnpm lint

         - name: Type-check
           run: pnpm type-check

         - name: Validate portfolio data
           run: pnpm validate:data

         - name: Run tests
           run: pnpm test

         - name: Security audit
           run: pnpm audit --audit-level=high

         # Deployment builds self-host the latest released CV. Pull requests
         # and runs on other branches skip this network dependency; Vite can
         # still compile and test the viewer's failure state without the
         # generated public files. The token gives the release lookup the
         # authenticated rate limit; the step fails if no tag resolves.
         - name: Prepare resume
           if: env.DEPLOY == 'true'
           env:
              GITHUB_TOKEN: ${{ github.token }}
           run: pnpm fetch:resume

         - name: Build with Vite
           run: pnpm build

         - name: Setup Pages
           if: env.DEPLOY == 'true'
           uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

         - name: Upload Pages artifact
           if: env.DEPLOY == 'true'
           uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
           with:
              path: build

   deploy:
      # Never for another ref: a dispatch on a bot sync branch runs CI only.
      if: >
         !cancelled() && needs.ci.result == 'success' &&
         github.ref == 'refs/heads/main'
      needs: ci
      # One deploy at a time, never cancelled half-way.
      concurrency:
         group: pages
         cancel-in-progress: false
      runs-on: ubuntu-latest
      permissions:
         contents: read
         pages: write
         id-token: write
      environment:
         name: github-pages
         url: ${{ steps.deployment.outputs.page_url }}
      steps:
         - name: Deploy to GitHub Pages
           id: deployment
           uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
